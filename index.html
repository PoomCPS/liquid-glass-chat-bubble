<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Liquid Glass Stream Chat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body class="bg-transparent">
  <!-- Demo Wallpaper Background (Only active during browser testing, transparent in OBS) -->
  <div id="demo-backdrop" class="demo-backdrop"></div>

  <!-- SVG Optical Lens Defs for Liquid Glass Refraction (Ekino-France Architecture) -->
  <svg class="optical-lens-defs" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <defs>
      <filter id="liquid-glass-lens" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
        <feTurbulence type="fractalNoise" baseFrequency="0.015 0.02" numOctaves="2" result="turbulence" />
        <feDisplacementMap id="glass-disp-map" in="SourceGraphic" in2="turbulence" scale="28" xChannelSelector="R"
          yChannelSelector="G" result="displaced" />
        <feSpecularLighting in="turbulence" surfaceScale="3.5" specularConstant="1.0" specularExponent="22"
          lighting-color="#ffffff" result="specular">
          <feDistantLight azimuth="215" elevation="45" />
        </feSpecularLighting>
        <feComposite in="specular" in2="displaced" operator="in" result="specularCut" />
        <feBlend in="displaced" in2="specularCut" mode="screen" />
      </filter>
    </defs>
  </svg>

  <!-- Main Floating Bubble Stack Container -->
  <main id="chat-stack" class="chat-stack" role="log" aria-live="polite"></main>

  <!-- Interactive HUD Drawer Trigger (Hidden in OBS mode) -->
  <button type="button" id="hud-toggle-btn" class="hud-trigger-btn" title="Toggle Settings (Hotkey: H or Esc)"
    aria-label="Settings" aria-expanded="false" aria-controls="settings-hud">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
      stroke-linecap="round" stroke-linejoin="round">
      <path
        d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z" />
      <circle cx="12" cy="12" r="3" />
    </svg>
    <span>Controls</span>
  </button>

  <!-- Interactive Settings HUD Drawer -->
  <aside id="settings-hud" class="settings-hud" inert>
    <div class="hud-header">
      <div class="hud-title-group">
        <span class="hud-logo-dot"></span>
        <h2>Liquid Glass Overlay</h2>
        <span class="hud-version-badge">iOS 27 Optics</span>
      </div>
      <button type="button" id="hud-close-btn" class="hud-icon-btn" aria-label="Close Settings">✕</button>
    </div>

    <div class="hud-body">
      <!-- Quick Actions / Simulation -->
      <section class="hud-section">
        <label class="hud-section-label">Live Simulation &amp; Demo</label>
        <div class="hud-button-row">
          <button type="button" id="btn-test-burst" class="btn-primary">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <polygon points="5 3 19 12 5 21 5 3" />
            </svg>
            Send Mockup Burst
          </button>
          <button type="button" id="btn-toggle-demo" class="btn-secondary">Auto Demo: Off</button>
          <button type="button" id="btn-clear-chat" class="btn-ghost" title="Clear chat bubbles">Clear</button>
        </div>
      </section>

      <!-- Connections -->
      <section class="hud-section">
        <label class="hud-section-label">Stream Channels</label>
        <div class="hud-field">
          <span class="hud-field-icon twitch-color">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
              <path
                d="M11.571 4.714h1.715v5.143H11.57zm4.715 0H18v5.143h-1.714zM6 0L1.714 4.286v15.428h5.143V24l4.286-4.286h3.428L22.286 12V0zm14.571 11.143l-3.428 3.428h-3.429l-3 3v-3H6.857V1.714h13.714z" />
            </svg>
          </span>
          <input type="text" id="input-twitch-channel" placeholder="Twitch Channel (e.g. shroud)" autocomplete="off"
            spellcheck="false">
          <button type="button" id="btn-connect-twitch" class="btn-tiny">Connect</button>
        </div>

        <div class="hud-field">
          <span class="hud-field-icon yt-color">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
              <path
                d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z" />
            </svg>
          </span>
          <input type="text" id="input-yt-video" placeholder="YouTube Video ID (Optional)" autocomplete="off"
            spellcheck="false">
        </div>

        <div class="hud-field">
          <span class="hud-field-icon key-color">🔑</span>
          <input type="password" id="input-yt-key" placeholder="YouTube API Key (Optional)" spellcheck="false"
            autocomplete="on">
        </div>
      </section>

      <!-- Optical Sliders -->
      <section class="hud-section">
        <label class="hud-section-label">Liquid Glass Optics</label>
        <div class="hud-slider-group">
          <div class="hud-slider-header">
            <span>Glass Opacity (Tint)</span>
            <span id="val-opacity">0%</span>
          </div>
          <input type="range" id="slider-opacity" min="0" max="45" value="0">
        </div>

        <div class="hud-slider-group">
          <div class="hud-slider-header">
            <span>Backdrop Blur</span>
            <span id="val-blur">2px</span>
          </div>
          <input type="range" id="slider-blur" min="0" max="24" value="2">
        </div>

        <div class="hud-slider-group">
          <div class="hud-slider-header">
            <span>Lens Edge Depth</span>
            <span id="val-depth">8px</span>
          </div>
          <input type="range" id="slider-depth" min="2" max="24" value="8">
        </div>

        <div class="hud-slider-group">
          <div class="hud-slider-header">
            <span>Lens Strength</span>
            <span id="val-strength">60</span>
          </div>
          <input type="range" id="slider-strength" min="10" max="150" value="60">
        </div>

        <div class="hud-slider-group">
          <div class="hud-slider-header">
            <span>Chromatic Aberration</span>
            <span id="val-cab">2</span>
          </div>
          <input type="range" id="slider-cab" min="0" max="8" value="2">
        </div>

        <div class="hud-slider-group">
          <div class="hud-slider-header">
            <span>Max Active Bubbles</span>
            <span id="val-limit">10</span>
          </div>
          <input type="range" id="slider-limit" min="4" max="20" value="10">
        </div>
      </section>

      <!-- Preview Background Switcher (Testing only) -->
      <section class="hud-section">
        <label class="hud-section-label">Test Background Refraction</label>
        <div class="hud-chip-row">
          <button type="button" class="bg-chip" data-bg="custom">Uploaded Artwork</button>
          <button type="button" class="bg-chip" data-bg="vibrant">Vibrant Game</button>
          <button type="button" class="bg-chip" data-bg="neon">Cyber Neon</button>
          <button type="button" class="bg-chip" data-bg="dark">Dark Minimal</button>
          <button type="button" class="bg-chip active" data-bg="transparent">Transparent (OBS)</button>
        </div>
      </section>

      <!-- OBS Browser Source Export -->
      <section class="hud-section">
        <label class="hud-section-label">OBS Studio Integration</label>
        <p class="hud-hint">Copy this link and paste it into an OBS <strong>Browser Source</strong> (Width: 480, Height:
          800):</p>
        <div class="hud-field">
          <input type="text" id="obs-url-display" readonly value="">
          <button type="button" id="btn-copy-obs" class="btn-primary btn-copy">Copy Link</button>
        </div>
      </section>
    </div>
  </aside>

  <script src="app.js?v=4"></script>
</body>

</html>
